name: Integration Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rust-integration:
    name: Rust integration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run library and CLI tests
        run: |
          cargo test --lib --tests --verbose
          cargo test -p exiftool-rs --verbose

      - name: Build release artifacts
        run: |
          cargo build --release
          cargo build --release --manifest-path exiftool-rs/Cargo.toml

      - name: Smoke test CLI
        run: ./exiftool-rs/target/release/exiftool-rs --help
