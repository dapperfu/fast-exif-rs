name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v0.11.2)"
        required: true
        default: "v0.11.2"

permissions:
  contents: write

jobs:
  build-cli:
    name: Build CLI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: exiftool-rs-linux-x86_64
            binary: exiftool-rs
          - os: windows-latest
            artifact: exiftool-rs-windows-x86_64
            binary: exiftool-rs.exe
          - os: macos-latest
            artifact: exiftool-rs-macos-aarch64
            binary: exiftool-rs

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build --release --manifest-path exiftool-rs/Cargo.toml

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          dest="dist/${{ matrix.artifact }}"
          if [[ "${{ matrix.binary }}" == *.exe ]]; then
            dest="${dest}.exe"
          fi
          cp "exiftool-rs/target/release/${{ matrix.binary }}" "$dest"
          ls -la dist

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-cli]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find . -type f \( -name 'exiftool-rs*' -o -name '*.exe' \) -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Get tag name
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Release ${{ steps.get_tag.outputs.tag }}
          body: |
            ## fast-exif-rs ${{ steps.get_tag.outputs.tag }}

            Pure Rust EXIF reader (ExifTool-compatible tag names) plus the `exiftool-rs` CLI.

            ### Install the library

            ```toml
            [dependencies]
            fast-exif-reader = "${{ steps.get_tag.outputs.tag }}"
            ```

            Strip a leading `v` from the tag if the crate version does not include it.

            ### CLI

            Download a binary from this release, or:

            ```bash
            git clone https://github.com/dapperfu/fast-exif-rs.git
            cd fast-exif-rs
            make install
            exiftool-rs extract photo.jpg
            ```
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
